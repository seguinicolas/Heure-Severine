<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Mes heures</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #eef2ec;
    --surface: #ffffff;
    --ink: #2b2e2a;
    --ink-muted: #767c73;
    --teal: #3f6657;
    --teal-light: #dce8e2;
    --plum: #8c5b6b;
    --plum-light: #f2e3e7;
    --line: #dde3da;
    --radius: 16px;
    --shadow: 0 2px 10px rgba(43, 46, 42, 0.06), 0 1px 2px rgba(43, 46, 42, 0.05);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
    padding-bottom: 40px;
  }

  .app {
    max-width: 480px;
    margin: 0 auto;
    padding: 0 16px;
  }

  header {
    padding: 28px 0 18px;
    text-align: center;
  }

  header h1 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 28px;
    margin: 0;
    letter-spacing: -0.01em;
  }

  header p {
    margin: 4px 0 0;
    color: var(--ink-muted);
    font-size: 14px;
  }

  .tabs {
    display: flex;
    background: var(--surface);
    border-radius: 999px;
    padding: 4px;
    box-shadow: var(--shadow);
    margin-bottom: 20px;
  }

  .tab-btn {
    flex: 1;
    border: none;
    background: transparent;
    padding: 10px 0;
    border-radius: 999px;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 14px;
    color: var(--ink-muted);
    cursor: pointer;
    transition: background 0.2s, color 0.2s;
  }

  .tab-btn.active {
    background: var(--teal);
    color: white;
  }

  .card {
    background: var(--surface);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 18px;
    margin-bottom: 16px;
  }

  .card h2 {
    font-family: 'Fraunces', serif;
    font-size: 17px;
    font-weight: 600;
    margin: 0 0 14px;
  }

  label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--ink-muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: 5px;
  }

  input[type="date"], input[type="time"], input[type="text"] {
    width: 100%;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1.5px solid var(--line);
    font-size: 15px;
    font-family: 'Inter', sans-serif;
    color: var(--ink);
    background: #fbfcfb;
  }

  input:focus {
    outline: none;
    border-color: var(--teal);
  }

  .field { margin-bottom: 14px; }

  .creneau {
    display: flex;
    gap: 8px;
    align-items: flex-end;
    margin-bottom: 10px;
  }

  .creneau .field { flex: 1; margin-bottom: 0; }

  .remove-btn {
    border: none;
    background: var(--plum-light);
    color: var(--plum);
    width: 38px;
    height: 38px;
    border-radius: 10px;
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
    flex-shrink: 0;
  }

  .add-creneau {
    width: 100%;
    padding: 10px;
    border-radius: 10px;
    border: 1.5px dashed var(--line);
    background: transparent;
    color: var(--teal);
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    margin-bottom: 16px;
  }

  .total-badge {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--teal-light);
    border-radius: 12px;
    padding: 12px 16px;
    margin-bottom: 16px;
  }

  .total-badge .label { font-size: 13px; color: var(--teal); font-weight: 600; text-transform: none; letter-spacing: 0; margin: 0; }
  .total-badge .value { font-family: 'Fraunces', serif; font-size: 22px; font-weight: 600; color: var(--teal); }

  .save-btn {
    width: 100%;
    padding: 14px;
    border-radius: 12px;
    border: none;
    background: var(--teal);
    color: white;
    font-weight: 700;
    font-size: 15px;
    cursor: pointer;
  }

  .save-btn:disabled { opacity: 0.6; }

  .msg {
    text-align: center;
    font-size: 13px;
    margin-top: 10px;
    min-height: 16px;
  }
  .msg.ok { color: var(--teal); }
  .msg.err { color: var(--plum); }

  .summary-row {
    display: flex;
    gap: 12px;
    margin-bottom: 16px;
  }

  .summary-card {
    flex: 1;
    background: var(--surface);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 14px;
    text-align: center;
  }

  .summary-card .label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--ink-muted);
    font-weight: 600;
  }

  .summary-card .value {
    font-family: 'Fraunces', serif;
    font-size: 24px;
    font-weight: 600;
    color: var(--ink);
    margin-top: 4px;
  }

  .day-card { cursor: pointer; }

  .day-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }

  .day-header .date-label {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 16px;
    text-transform: capitalize;
  }

  .day-header .duree-label {
    font-weight: 700;
    color: var(--teal);
    font-size: 15px;
  }

  .ribbon {
    position: relative;
    height: 10px;
    background: var(--line);
    border-radius: 6px;
    margin: 10px 0 4px;
    overflow: hidden;
  }

  .ribbon .segment {
    position: absolute;
    top: 0;
    bottom: 0;
    background: var(--teal);
    border-radius: 6px;
  }

  .ribbon-scale {
    display: flex;
    justify-content: space-between;
    font-size: 10px;
    color: var(--ink-muted);
  }

  .details { margin-top: 12px; display: none; }
  .details.open { display: block; }

  .creneau-line {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 14px;
    padding: 8px 0;
    border-top: 1px solid var(--line);
  }

  .creneau-line .times { color: var(--ink); }
  .creneau-line .comment { color: var(--ink-muted); font-size: 12px; }

  .delete-x {
    border: none;
    background: transparent;
    color: var(--plum);
    font-size: 16px;
    cursor: pointer;
    padding: 4px 8px;
  }

  .empty-state {
    text-align: center;
    color: var(--ink-muted);
    font-size: 14px;
    padding: 30px 10px;
  }

  .hidden { display: none; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Mes heures</h1>
    <p>Saisis tes journées, on s'occupe du reste</p>
  </header>

  <div class="tabs">
    <button class="tab-btn active" id="tab-saisie-btn" onclick="switchTab('saisie')">Saisie</button>
    <button class="tab-btn" id="tab-historique-btn" onclick="switchTab('historique')">Historique</button>
  </div>

  <section id="tab-saisie">
    <div class="card">
      <h2>Nouvelle journée</h2>
      <div class="field">
        <label for="date-input">Date</label>
        <input type="date" id="date-input">
      </div>

      <div id="creneaux-list"></div>
      <button class="add-creneau" onclick="addCreneau()">+ Ajouter un créneau</button>

      <div class="total-badge">
        <span class="label">Total du jour</span>
        <span class="value" id="jour-total">0h00</span>
      </div>

      <div class="field">
        <label for="commentaire-input">Commentaire (optionnel)</label>
        <input type="text" id="commentaire-input" placeholder="Ex : remplacement, formation...">
      </div>

      <button class="save-btn" id="save-btn" onclick="saveDay()">Enregistrer</button>
      <div class="msg" id="save-msg"></div>
    </div>
  </section>

  <section id="tab-historique" class="hidden">
    <div class="summary-row">
      <div class="summary-card">
        <div class="label">Cette semaine</div>
        <div class="value" id="week-total">–</div>
      </div>
      <div class="summary-card">
        <div class="label">Ce mois</div>
        <div class="value" id="month-total">–</div>
      </div>
    </div>
    <div id="history-list"></div>
  </section>
</div>

<script>
  // ⚠️ Remplace cette URL par celle de ton déploiement Apps Script (voir instructions)
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxSSzxh57xbWEhEnT5ybZJw062nx9U7OV-CyWxkleDNwzJOQnvMKMfZiUmt7aAh4y9-kg/exec";

  let creneauCount = 0;
  let allEntries = [];

  function todayISO() {
    const d = new Date();
    return d.toISOString().slice(0, 10);
  }

  function init() {
    document.getElementById('date-input').value = todayISO();
    addCreneau();
    loadHistory();
  }

  function switchTab(tab) {
    document.getElementById('tab-saisie').classList.toggle('hidden', tab !== 'saisie');
    document.getElementById('tab-historique').classList.toggle('hidden', tab !== 'historique');
    document.getElementById('tab-saisie-btn').classList.toggle('active', tab === 'saisie');
    document.getElementById('tab-historique-btn').classList.toggle('active', tab === 'historique');
    if (tab === 'historique') loadHistory();
  }

  function addCreneau() {
    creneauCount++;
    const id = 'creneau-' + creneauCount;
    const div = document.createElement('div');
    div.className = 'creneau';
    div.id = id;
    div.innerHTML = `
      <div class="field">
        <label>Début</label>
        <input type="time" class="c-debut" onchange="updateTotal()">
      </div>
      <div class="field">
        <label>Fin</label>
        <input type="time" class="c-fin" onchange="updateTotal()">
      </div>
      <button class="remove-btn" onclick="removeCreneau('${id}')">×</button>
    `;
    document.getElementById('creneaux-list').appendChild(div);
  }

  function removeCreneau(id) {
    const el = document.getElementById(id);
    if (el) el.remove();
    updateTotal();
  }

  function timeToHours(t) {
    if (!t) return null;
    const [h, m] = t.split(':').map(Number);
    return h + m / 60;
  }

  function formatHours(h) {
    const hh = Math.floor(h);
    const mm = Math.round((h - hh) * 60);
    return hh + 'h' + String(mm).padStart(2, '0');
  }

  function getCreneauxFromForm() {
    const rows = document.querySelectorAll('#creneaux-list .creneau');
    const result = [];
    rows.forEach(row => {
      const debut = row.querySelector('.c-debut').value;
      const fin = row.querySelector('.c-fin').value;
      if (debut && fin) {
        let d = timeToHours(debut);
        let f = timeToHours(fin);
        if (f < d) f += 24; // passage minuit, au cas où
        result.push({ debut, fin, duree: f - d });
      }
    });
    return result;
  }

  function updateTotal() {
    const creneaux = getCreneauxFromForm();
    const total = creneaux.reduce((sum, c) => sum + c.duree, 0);
    document.getElementById('jour-total').textContent = formatHours(total);
  }

  async function saveDay() {
    const date = document.getElementById('date-input').value;
    const commentaire = document.getElementById('commentaire-input').value;
    const creneaux = getCreneauxFromForm();
    const msg = document.getElementById('save-msg');
    const btn = document.getElementById('save-btn');

    if (!date || creneaux.length === 0) {
      msg.textContent = "Ajoute une date et au moins un créneau valide.";
      msg.className = "msg err";
      return;
    }

    const entries = creneaux.map(c => ({
      date, debut: c.debut, fin: c.fin, duree: c.duree, commentaire
    }));

    btn.disabled = true;
    msg.textContent = "Enregistrement...";
    msg.className = "msg";

    try {
      await fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'add', entries })
      });
      msg.textContent = "Journée enregistrée ✓";
      msg.className = "msg ok";

      document.getElementById('creneaux-list').innerHTML = '';
      creneauCount = 0;
      addCreneau();
      document.getElementById('commentaire-input').value = '';
      updateTotal();
      loadHistory();
    } catch (err) {
      msg.textContent = "Erreur d'enregistrement, réessaie.";
      msg.className = "msg err";
    } finally {
      btn.disabled = false;
    }
  }

  async function loadHistory() {
    const list = document.getElementById('history-list');
    try {
      const res = await fetch(APPS_SCRIPT_URL);
      const data = await res.json();
      allEntries = data.entries || [];
      renderHistory();
    } catch (err) {
      list.innerHTML = '<div class="empty-state">Impossible de charger l\\'historique.</div>';
    }
  }

  function getWeekNumber(d) {
    const date = new Date(d);
    date.setHours(0,0,0,0);
    date.setDate(date.getDate() + 3 - (date.getDay() + 6) % 7);
    const week1 = new Date(date.getFullYear(), 0, 4);
    return date.getFullYear() + '-' + Math.round(((date - week1) / 86400000 - 3 + (week1.getDay() + 6) % 7) / 7 + 1);
  }

  function renderHistory() {
    const list = document.getElementById('history-list');
    if (allEntries.length === 0) {
      list.innerHTML = '<div class="empty-state">Aucune journée enregistrée pour l\\'instant.</div>';
      document.getElementById('week-total').textContent = '0h00';
      document.getElementById('month-total').textContent = '0h00';
      return;
    }

    // Regrouper par date
    const byDate = {};
    allEntries.forEach(e => {
      if (!byDate[e.date]) byDate[e.date] = [];
      byDate[e.date].push(e);
    });

    const dates = Object.keys(byDate).sort().reverse();

    const now = new Date();
    const currentWeek = getWeekNumber(now);
    const currentMonth = now.toISOString().slice(0, 7);

    let weekTotal = 0, monthTotal = 0;
    allEntries.forEach(e => {
      const d = parseFloat(e.duree) || 0;
      if (getWeekNumber(e.date) === currentWeek) weekTotal += d;
      if (e.date.slice(0, 7) === currentMonth) monthTotal += d;
    });

    document.getElementById('week-total').textContent = formatHours(weekTotal);
    document.getElementById('month-total').textContent = formatHours(monthTotal);

    list.innerHTML = '';
    dates.forEach((date, idx) => {
      const entries = byDate[date];
      const dayTotal = entries.reduce((sum, e) => sum + (parseFloat(e.duree) || 0), 0);
      const dateObj = new Date(date + 'T00:00:00');
      const dateLabel = dateObj.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });

      const card = document.createElement('div');
      card.className = 'card day-card';
      const detailsId = 'details-' + idx;

      let ribbonHtml = '';
      entries.forEach(e => {
        const start = timeToHours(e.debut);
        const end = timeToHours(e.fin);
        const left = (start / 24) * 100;
        const width = ((end - start) / 24) * 100;
        ribbonHtml += `<div class="segment" style="left:${left}%; width:${width}%;"></div>`;
      });

      let detailsHtml = '';
      entries.forEach(e => {
        detailsHtml += `
          <div class="creneau-line">
            <div>
              <div class="times">${e.debut} – ${e.fin} (${formatHours(parseFloat(e.duree))})</div>
              ${e.commentaire ? `<div class="comment">${escapeHtml(e.commentaire)}</div>` : ''}
            </div>
            <button class="delete-x" onclick="deleteEntry(event, '${e.id}')">🗑</button>
          </div>
        `;
      });

      card.innerHTML = `
        <div onclick="toggleDetails('${detailsId}')">
          <div class="day-header">
            <span class="date-label">${dateLabel}</span>
            <span class="duree-label">${formatHours(dayTotal)}</span>
          </div>
          <div class="ribbon">${ribbonHtml}</div>
          <div class="ribbon-scale"><span>0h</span><span>12h</span><span>24h</span></div>
        </div>
        <div class="details" id="${detailsId}">${detailsHtml}</div>
      `;
      list.appendChild(card);
    });
  }

  function toggleDetails(id) {
    document.getElementById(id).classList.toggle('open');
  }

  async function deleteEntry(event, id) {
    event.stopPropagation();
    if (!confirm('Supprimer ce créneau ?')) return;
    try {
      await fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'delete', id })
      });
      loadHistory();
    } catch (err) {
      alert("Erreur lors de la suppression.");
    }
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  init();
</script>
</body>
</html>
